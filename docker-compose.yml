version: '3.9'

services:
  backend:
    build: ./backend
    container_name: apply-ai-backend
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ADZUNA_APP_ID=${ADZUNA_APP_ID:-}
      - ADZUNA_APP_KEY=${ADZUNA_APP_KEY:-}
      - ADZUNA_COUNTRY=${ADZUNA_COUNTRY:-us}
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data

  frontend:
    build: ./frontend
    container_name: apply-ai-frontend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: apply-ai-nginx
    restart: unless-stopped
    ports:
      - "3001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

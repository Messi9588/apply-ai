<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { width: 280px; background: #111827; color: #e5e7eb; font-family: -apple-system, sans-serif; margin: 0; padding: 16px; }
  h2 { color: #a5b4fc; font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 6px; }
  label { font-size: 12px; color: #9ca3af; display: block; margin-bottom: 4px; }
  input { width: 100%; background: #1f2937; border: 1px solid #374151; border-radius: 6px; color: #e5e7eb; font-size: 13px; padding: 8px 10px; box-sizing: border-box; }
  input:focus { outline: none; border-color: #6366f1; }
  button { width: 100%; background: #4f46e5; color: white; border: none; border-radius: 6px; padding: 9px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 10px; }
  button:hover { background: #4338ca; }
  #status { font-size: 12px; color: #6b7280; margin-top: 10px; text-align: center; }
  #status.ok { color: #16a34a; }
  #status.err { color: #dc2626; }
  .divider { border: none; border-top: 1px solid #374151; margin: 12px 0; }
  .pending-box { background: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 10px; margin-top: 10px; }
  .pending-title { font-size: 12px; color: #a5b4fc; font-weight: 600; }
  .pending-org { font-size: 11px; color: #6b7280; margin-top: 2px; }
  .clear-btn { background: #374151; margin-top: 8px; font-weight: 400; }
  .clear-btn:hover { background: #4b5563; }
</style>
</head>
<body>
<h2>✦ ApplyAI</h2>
<label>ApplyAI Server URL</label>
<input type="text" id="serverUrl" placeholder="http://134.122.118.9:3001" />
<button id="save">Save</button>
<div id="status"></div>
<hr class="divider">
<div id="pending-section"></div>
<script src="popup.js"></script>
</body>
</html>
